<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Senior Anandam: Joint Care, Fall Prevention &amp; Breathing Care Products</title>
  <meta name="description"
    content="Trusted senior care products by Senior Anandam - joint support, fall prevention, breathing care, gut wellness &amp; more. Built for Indians who want to age well." />
  <meta name="keywords"
    content="Senior care products, knee support, joint care, fall prevention, walking sticks, blood pressure monitors, elderly wellness" />

  <!-- DNS prefetch & preconnect for faster external resource fetching -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
  <link rel="dns-prefetch" href="https://checkout.razorpay.com" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Only load font weights we actually use, with display=swap -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
    rel="stylesheet">

  <style>
    body {
      background-color: #FAFAFA;
      margin: 0;
      font-family: 'Inter', sans-serif;
    }
    
    /* Pre-hydration loader style */
    #root:empty {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #FAFAFA;
    }
    #root:empty::after {
      content: "";
      width: 40px;
      height: 40px;
      border: 4px solid #E5E7EB;
      border-top-color: #EF4444; /* Primary Red */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <!-- Razorpay loaded async so it never blocks page render -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" async></script>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
